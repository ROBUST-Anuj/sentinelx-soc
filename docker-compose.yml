version: '3.8'

services:
  sentinelx-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinelx-backend
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/sentinelx.db
      - SYNC_DATABASE_URL=sqlite:///./data/sentinelx.db
    volumes:
      - ./data:/app/data
      - ./ml:/app/ml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  sentinelx-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinelx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - sentinelx-backend
